<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in Html</title>
</head>
<body>
    <h1>Ordered List</h1>
    <ol type ="a">
        <!-- type ="give What type u represent"-->
         <!--start ="give where you want to start"-->
        <li>Apple</li>
        <li>Banana</li>
        <li>Grapes</li>
    </ol>

    <h1>UnOrder List</h1>
    <ul>
        <!-- Only type works here -->
        <li>raju</li>
        <li>rani</li>
        <li>krish</li>
    </ul>
    <h1>Defination List</h1>
    <dl>
        <dt>HTML</dt>
        <dd>Hyper Text Markup Language</dd>
        <dt>JS</dt>
        <dd>JavaScript</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>

    </dl>
    
</body>
</html>
