<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in HTML</title>
</head>
<body>
    <h1>Captcha Form</h1>
    <form>
        <label for="captcha">Enter Captcha<span style="color:red;">*</span>:</label>
        <input type="text"  id="captcha" name="Captcha" placeholder="Enter the captcha here" 
        title="Captcha should be in 6 characters" required  autocapitalize="off">
        <br> <br>
        <input type="submit" value="Ok">
        <button type="reset">Reset</button>
        
    </form>
    
</body>
</html>
